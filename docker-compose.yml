version: '3.8'

services:
  votingly-db:
    container_name: votingly-db
    image: postgres:15.5-alpine3.17
    restart: unless-stopped
    ports:
      - 5431:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=votingly

  votingly-test-db:
    container_name: votingly-test-db
    image: postgres:15.5-alpine3.17
    restart: unless-stopped
    ports:
      - 5331:5432
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=votingly

volumes:
  pgdata:
  pgdata_test: